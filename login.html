<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - PPT DESIGNER</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center">
    <div class="container mx-auto px-4 max-w-md">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="bg-orange-600 text-white px-6 py-4 text-center">
                <i class="ri-book-line text-3xl"></i>
                <h2 class="text-2xl font-bold mt-2">تسجيل الدخول</h2>
            </div>
            <div class="p-6">
                <form>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-bold mb-2">البريد الإلكتروني</label>
                        <input type="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 font-bold mb-2">كلمة المرور</label>
                        <input type="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700 mb-4">
                        تسجيل الدخول
                    </button>
                    <div class="text-center">
                        <a href="forgot-password.html" class="text-orange-600 hover:underline">نسيت كلمة المرور؟</a>
                    </div>
                </form>
            </div>
            <div class="bg-gray-100 px-6 py-4 text-center">
                <p>ليس لديك حساب؟ <a href="register.html" class="text-orange-600 font-bold hover:underline">سجل الآن</a></p>
            </div>
        </div>
    </div>
</body>
</html>
